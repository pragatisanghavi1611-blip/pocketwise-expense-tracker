<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit transaction | Pocketwise</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="edit panel"><a href="/">← Back to dashboard</a><h1>Edit transaction</h1><form th:action="@{/transactions/{id}/edit(id=${transaction.id})}" method="post" class="form"><div class="types"><label><input type="radio" name="type" value="EXPENSE" th:checked="${transaction.type=='EXPENSE'}"> Expense</label><label><input type="radio" name="type" value="INCOME" th:checked="${transaction.type=='INCOME'}"> Income</label></div><label>Transaction name<input name="title" th:value="${transaction.title}" required></label><div class="twocol"><label>Amount (₹)<input name="amount" type="number" min=".01" step=".01" th:value="${transaction.amount}" required></label><label>Date<input name="transactionDate" type="date" th:value="${transaction.transactionDate}" required></label></div><label>Category<select name="category"><option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${transaction.category==c}"></option></select></label><label>Note<input name="description" th:value="${transaction.description}"></label><button class="button">Update transaction</button></form></main></body></html>
