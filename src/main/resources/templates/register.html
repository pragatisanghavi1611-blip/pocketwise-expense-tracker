<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Pocketwise</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="auth panel"><a class="brand" href="/">₹ pocketwise</a><h1>Create your account</h1><p>Your financial records are private to your account.</p><p class="error" th:if="${error}" th:text="${error}"></p><form class="form" method="post" th:action="@{/register}"><label>Full name<input name="name" required maxlength="100"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="10" autocomplete="new-password"><small>At least 10 characters.</small></label><button class="button">Create account</button></form><p>Already registered? <a href="/login">Sign in</a></p></main></body></html>
