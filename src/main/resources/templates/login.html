<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Pocketwise</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="auth panel"><a class="brand" href="/">₹ pocketwise</a><h1>Welcome back</h1><p>Sign in to manage your money.</p><p class="notice" th:if="${success}" th:text="${success}"></p><p class="error" th:if="${param.error}">Email or password is incorrect.</p><p class="notice" th:if="${param.logout}">You have signed out.</p><form class="form" method="post" th:action="@{/login}"><label>Email<input type="email" name="username" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button">Sign in</button></form><p>New to Pocketwise? <a href="/register">Create an account</a></p></main></body></html>
