<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Pocketwise</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a href="/" class="brand">₹ pocketwise</a><span>ADMIN CONSOLE · <a href="/" style="color:white">USER APP</a></span></header><main><section class="intro"><div><small>PLATFORM OVERVIEW</small><h1>Admin dashboard<span>.</span></h1><p>Manage users and monitor platform activity.</p></div><form method="post" th:action="@{/logout}"><button class="button">Sign out</button></form></section><section class="stats"><article><small>REGISTERED USERS</small><strong th:text="${userCount}"></strong></article><article><small>ADMIN ACCOUNTS</small><strong th:text="${adminCount}"></strong></article><article><small>ALL TRANSACTIONS</small><strong th:text="${transactionCount}"></strong></article></section><section class="panel"><h2>Accounts</h2><div class="scroll"><table><thead><tr><th>NAME</th><th>EMAIL</th><th>ROLE</th><th>ACCOUNT ID</th></tr></thead><tbody><tr th:each="u : ${users}"><td th:text="${u.name}"></td><td th:text="${u.email}"></td><td th:text="${u.role}"></td><td th:text="${u.id}"></td></tr></tbody></table></div></section><section class="panel" style="margin-top:18px"><h2>All transactions</h2><div class="scroll"><table><thead><tr><th>NAME</th><th>CATEGORY</th><th>TYPE</th><th>AMOUNT</th><th>DATE</th><th>USER ID</th></tr></thead><tbody><tr th:each="t : ${transactions}"><td th:text="${t.title}"></td><td th:text="${t.category}"></td><td th:text="${t.type}"></td><td th:text="${t.amount}"></td><td th:text="${t.transactionDate}"></td><td th:text="${t.owner != null ? t.owner.id : 'Legacy'}"></td></tr></tbody></table></div></section></main></body></html>
